# application-dev.yml
logging:
  level:
    com.example.mall: debug
    com.example.mall.mapper: debug      # 直接把 SQL 打出来

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump
      base-path: /actuator          # 默认就是这个，写出来便于以后改
  endpoint:
    health:
      show-details: always
info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    description: 电商练习项目