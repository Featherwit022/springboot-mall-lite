server:
  port: 8080

spring:
  application:
    name: mall
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true                       # create_time → createTime
  global-config:
    db-config:
      id-type: auto                                          # 主键自增
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.mall.entity
mall:
  name: 小卖部
  order:
    pay-timeout: 15m          # 自动绑定成 Duration.ofMinutes(15)
    max-items: 20